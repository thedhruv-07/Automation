# Render Blueprint for the FastAPI backend. This is a best-effort convenience
# file -- Render's Blueprint schema has changed across versions, so verify
# the field names here against Render's current "Blueprint (render.yaml)"
# docs before relying on it. docs/DEPLOYMENT.md's manual dashboard steps are
# the authoritative path if this file is stale by the time you deploy.
#
# NOTE: Render's "New Blueprint" flow may prompt for payment info on file
# even with `plan: free` below -- observed 2026-07-23, unclear if this is a
# blanket Blueprint-feature policy or something else. If that happens and
# you don't want to add a card, use "New Web Service" (manual, non-Blueprint)
# instead and enter these same settings by hand -- see docs/DEPLOYMENT.md.
#
# DATA PERSISTENCE: the app's data (client roster, send-dedup logs, notice
# logs) lives in MongoDB Atlas, not on Render's filesystem at all -- so
# unlike the old SQLite setup, a redeploy/restart/spin-down never wipes
# anything, on the free tier or otherwise. No Render Disk is needed.
services:
  - type: web
    name: absolute-veritas-dashboard-backend
    runtime: python
    plan: free
    rootDir: dashboard-app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: cert_renewal_alert
      - key: WHATSAPP_TEMPLATE_LANG
        value: en
      - key: EMAIL_SENDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DASHBOARD_ALLOWED_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WASABI_ACCESS_KEY
        sync: false
      - key: WASABI_SECRET_KEY
        sync: false
      - key: WASABI_BUCKET
        sync: false
      - key: WASABI_ENDPOINT
        sync: false
