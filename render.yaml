# Render Blueprint for the FastAPI backend. This is a best-effort convenience
# file -- Render's Blueprint schema has changed across versions, so verify
# the field names here against Render's current "Blueprint (render.yaml)"
# docs before relying on it. docs/DEPLOYMENT.md's manual dashboard steps are
# the authoritative path if this file is stale by the time you deploy.
#
# FREE TIER: no persistent disk. clients.db lives on the service's ephemeral
# filesystem (the repo-relative data/clients.db default -- no DASHBOARD_DB_PATH
# override needed) and is wiped on every restart/redeploy/spin-down-from-
# inactivity. See docs/DEPLOYMENT.md for the re-load-data-after-every-reset
# workflow this implies. Upgrading to a paid instance + Render Disk later
# just means adding back a `disk:` block and a DASHBOARD_DB_PATH env var
# pointing at its mount path -- no code change either way, since db.py
# already reads DASHBOARD_DB_PATH when set and falls back to data/clients.db
# otherwise.
services:
  - type: web
    name: absolute-veritas-dashboard-backend
    runtime: python
    rootDir: dashboard-app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: cert_renewal_alert
      - key: WHATSAPP_TEMPLATE_LANG
        value: en
      - key: EMAIL_SENDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_ALLOWED_ORIGIN
        sync: false
